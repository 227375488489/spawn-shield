# SpawnShield 2.1.0 — самостоятельная защита мира спавна и телепорт /spawn.
# Плагин не зависит от AuraCore/Aura*: свой namespace, свои permissions, только Paper API.

# Префикс обычных сообщений в чате.
prefix: '<gradient:#7DE3F4:#B388FF><bold>SpawnShield</bold></gradient> <dark_gray>›</dark_gray> '

# Миры, которые защищены целиком. Для текущего сервера это void-мир 'spawn'
# (раньше здесь ошибочно стояло 'worlds:spawn', из-за чего защита не работала).
protected-worlds:
  - 'spawn'

# Дополнительный радиус защиты вокруг /spawn set (0 = выключено).
# Нужен, если в списке protected-worlds указан не весь мир.
spawn-radius: 96

teleport:
  # Отсчёт в секундах. 0 = мгновенный телепорт.
  warmup-seconds: 3
  # На сколько блоков можно сдвинуться до отмены телепорта.
  cancel-distance: 0.35
  # Затемнение экрана (Blindness) до и во время переноса, снимается после прибытия.
  blindness: true
  # Звуки и частицы.
  effects: true
  # Показывать отчёт об отсчёте в action bar.
  countdown-actionbar: true

  # Заголовок во время отсчёта (без секунд — они только в action bar).
  title: '<gradient:#7DE3F4:#B388FF><bold>НЕ ДВИГАЙТЕСЬ</bold></gradient>'
  subtitle: '<gray>Идёт телепортация</gray> <dark_gray>•</dark_gray> <#B388FF>приготовьтесь</#B388FF>'
  countdown: '<#7DE3F4>Телепорт</#7DE3F4> <dark_gray>•</dark_gray> <gray>через</gray> <white>%time%</white><gray>с</gray>'

  # Короткая вспышка в момент переноса.
  moving-title: '<dark_gray>✦</dark_gray>'
  moving-subtitle: '<gray>Перемещаем вас на спавн…</gray>'

  # Прибытие на спавн.
  success-title: '<gradient:#7DE3F4:#B388FF>✦ СПАВН ✦</gradient>'
  success-subtitle: '<gray>Добро пожаловать домой</gray>'
  success-actionbar: '<#7DE3F4>Вы на спавне</#7DE3F4>'

  # Отмена.
  moved: '<#FF6B6B>× Телепорт отменён</#FF6B6B> <dark_gray>•</dark_gray> <gray>вы сдвинулись с места</gray>'
  damaged: '<#FF6B6B>× Телепорт отменён</#FF6B6B> <dark_gray>•</dark_gray> <gray>вы получили урон</gray>'

# Падение в бездну (ниже минимальной высоты мира) возвращает на спавн.
void:
  enabled: true
  # Насколько ниже minHeight мира начинать спасение.
  offset: 8
  # 0 = мгновенно. Можно поставить 1, если нужна задержка.
  warmup-seconds: 0
  title: '<gradient:#FF6B6B:#FFB86B><bold>БЕЗДНА</bold></gradient>'
  subtitle: '<gray>Возвращаем вас на спавн…</gray>'
  actionbar: '<#FF6B6B>Бездна</#FF6B6B> <dark_gray>→</dark_gray> <#7DE3F4>спавн</#7DE3F4>'
  returned: '<#7DE3F4>✦ Бездна вернула вас на спавн</#7DE3F4>'

protection:
  # Разрешить игрокам открывать обычные и ловушечные сундуки.
  # Всё остальное в защищённой зоне блокируется: двери, кнопки, рычаги,
  # таблички, вазы, вёдра, верстаки, печи и т.д.
  allow-chests: true
  # Держать в защищённых мирах ясную погоду.
  disable-weather: true
  # Не давать голодать на спавне.
  block-hunger: true
  # Не давать спавниться мобам (кроме CUSTOM/COMMAND — NPC и плагины).
  block-mob-spawns: true
  # Отменять любой урон всем сущностям в зоне спавна.
  block-entity-damage: true

# Заголовок после смерти (не влияет на защиту).
death:
  enabled: true
  phrases:
    - '<gradient:#FF6B6B:#FFB86B>Снова ты?</gradient>'
    - '<gradient:#7DE3F4:#B388FF>Ты воскрес...</gradient>'
    - '<gradient:#A8E6CF:#7DE3F4>С возвращением.</gradient>'
    - '<gradient:#FFD166:#FF6B6B>Смерть — не конец.</gradient>'
    - '<gradient:#C5C6CA:#7DE3F4>Опять?</gradient>'
    - '<gradient:#B388FF:#7DE3F4>Новая попытка.</gradient>'
  subtitle: '<gray>Ты снова в игре</gray>'

messages:
  only-players: '<#FF6B6B>× Только для игроков.</#FF6B6B>'
  no-permission: '<#FF6B6B>× Недостаточно прав.</#FF6B6B>'
  spawn-not-found: '<#FF6B6B>× Спавн не найден.</#FF6B6B> <gray>Загрузите мир и выполните</gray> <white>/spawn set</white><gray>.</gray>'
  spawn-set: '<#7DE3F4>✦ Точка спавна обновлена.</#7DE3F4> <gray>Теперь сюда ведёт</gray> <white>/spawn</white><gray>.</gray>'
  reloaded: '<#7DE3F4>✦ Настройки SpawnShield перезагружены.</#7DE3F4>'
  edit-on: '<#FFD166>⚠ Режим редактирования включён.</#FFD166> <gray>Защита спавна временно снята.</gray>'
  edit-off: '<#7DE3F4>✦ Режим редактирования выключен.</#7DE3F4> <gray>Защита снова активна.</gray>'
  edit-usage: '<#FF6B6B>Использование:</#FF6B6B> <white>/spawn edit true|false</white>'
  teleport-failed: '<#FF6B6B>× Не удалось телепортировать вас на спавн.</#FF6B6B>'
